# Plugins get appended here phase by phase. Nothing is ever added to this
# file for a plugin that doesn't yet pass its own phase's exit check.
plugins:
  - name: '@deepseek-ai/dsh-jarvis-models'

  # Voicebox MCP — Phase 4
  # Native Voicebox.app running on port 17493 (Docker remaps to 17600)
  - id: mcp-voicebox
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: voicebox
      transport: streamable-http
      url: http://127.0.0.1:17493/mcp
      toolCallTimeoutMs: 120000
      reconnect:
        enabled: true
        initialDelayMs: 1000
        maxDelayMs: 30000
        maxAttempts: 10
