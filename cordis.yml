# Plugins get appended here phase by phase. Nothing is ever added to this
# file for a plugin that doesn't yet pass its own phase's exit check.
plugins:
  - name: '@deepseek-ai/dsh-jarvis-models'

  # Voicebox MCP — Phase 4
  # Discovered runtime endpoint: http://127.0.0.1:17600/mcp (port differs from
  # documented 17493 due to Docker host-side remapping)
  - id: mcp-voicebox
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: voicebox
      transport: streamable-http
      url: http://127.0.0.1:17600/mcp
      toolCallTimeoutMs: 120000
      reconnect:
        enabled: true
        initialDelayMs: 1000
        maxDelayMs: 30000
        maxAttempts: 10
